# Netlify build configuration.
#
# The Next.js runtime turns the App Router route handlers into Netlify Functions and
# serves the rest from the CDN. The data CSVs and the model bundle are pulled into each
# function through outputFileTracingIncludes in next.config.mjs, so the handlers can read
# them from disk at request time.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # next build needs more than the default heap for a dataset this size
  NODE_OPTIONS = "--max-old-space-size=4096"
  # `netlify deploy --build` builds on the local machine, which may be memory-starved,
  # so serialise static generation. Costs a little time and never crashes.
  LOWMEM = "1"
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
